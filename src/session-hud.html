<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;">
<title>Session HUD</title>
<style>
* { box-sizing: border-box; }

:root {
  --hud-bg: rgba(255, 255, 255, 0.88);
  --hud-border: rgba(0, 0, 0, 0.12);
  --text: #242427;
  --text-muted: #6b6b70;
  --shadow: rgba(0, 0, 0, 0.16);
  --interrupted: #d97706;
}

@media (prefers-color-scheme: dark) {
  :root {
    --hud-bg: rgba(32, 32, 36, 0.88);
    --hud-border: rgba(255, 255, 255, 0.12);
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --shadow: rgba(0, 0, 0, 0.34);
  }
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  font-size: 12px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* 窗口壳：主进程按「卡片 + 壳」算窗口尺寸，这里的数字必须和主进程一致。
   底部 60px 净空给 macOS 输入法候选窗——那块区域完全透明、不放任何东西。
   太小的话系统会认为光标下面放不下，把候选窗翻到输入框上方被卡片盖住。 */
body { padding: 2px 3px 60px; }

/* 卡片贴底排列：展开时窗口向上变大，卡片底边因此钉住不动，只往上长。 */
#hud {
  height: 100%;
  display: flex;
  align-items: flex-end;
}

/* 卡片：宽度由窗口撑满（300px 卡片 + 左右各 3px 壳 = 306px 窗口） */
.quick-card {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 8px;
  border: 1px solid var(--hud-border);
  border-radius: 8px;
  background: var(--hud-bg);
  box-shadow: 0 8px 18px -12px var(--shadow), 0 2px 4px rgba(0, 0, 0, 0.10);
  overflow: hidden;
}

/* 默认两行：6 + 16 + 4 + 32 + 6 + 2 = 66px。主进程按同一组数字算窗口高度。 */
.quick-card { height: 66px; }

/* 展开会话列表：列表区 250px（4 条会话 4×28 + 新建 28 + 两个开关 34+34 +
   选文件夹 28 + 行距 7×2）→ 66 + 250 + 4 = 320px。
   和当初的二级菜单一样，展开时靠 overflow:hidden 裁切、卡片只往上长。 */
body.session-list-open .quick-card { height: 320px; }

/* 挂了附件：多一行 24px 的小标签（输入框上方），再加卡片自己的一个行距 4。
   多出来的高度同样往上长，输入框的位置一动不动。
   这两条必须排在前面两条之后（同特异性、后者胜）；主进程那边由
   src/session-hud.js 的 quickCardHeight(listOpen, hasAttachments) 算同一个数。 */
body.has-attachments .quick-card { height: 94px; }
body.session-list-open.has-attachments .quick-card { height: 348px; }

/* ===== 状态行（第 1 行，16px 单行省略） ===== */
.quick-status-row {
  height: 16px;
  flex: 0 0 16px;
  min-width: 0;
  display: flex;
  align-items: center;
}

.quick-status-text {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  line-height: 1;
  color: var(--text-muted);
}

.quick-status-text.is-error {
  color: var(--interrupted);
}

/* ===== 目标会话按钮（整行可点，点开是会话列表） ===== */
.quick-target-btn {
  width: 100%;
  height: 16px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
  text-align: left;
}
.quick-target-btn:hover .quick-status-text { color: var(--text); }
.quick-target-caret {
  flex: 0 0 auto;
  font-size: 10px;
  line-height: 1;
  color: var(--text-muted);
}
body.session-list-open .quick-target-caret { transform: rotate(180deg); }

/* ===== 会话列表（展开时 250px：4 条会话 + 新建 + 两个开关 + 选文件夹） ===== */
.quick-session-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  height: 0;
  overflow: hidden;
}
body.session-list-open .quick-session-list { height: 250px; }

.quick-session-item {
  flex: 0 0 28px;
  height: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
  padding: 0 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
}
.quick-session-item:hover { background: rgba(127, 127, 127, 0.14); }
.quick-session-item.is-active { background: rgba(59, 130, 246, 0.14); }
.quick-session-name {
  font-size: 12px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.quick-session-meta {
  font-size: 10px;
  line-height: 1.2;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.quick-session-create .quick-session-name { color: rgba(59, 130, 246, 0.95); }
/* 选文件夹是次要动作：不抢新建会话那一行的蓝色。 */
.quick-session-folder .quick-session-name { color: var(--text-muted); }
.quick-session-item:focus { outline: none; }
.quick-session-item:focus-visible,
.quick-chip:focus-visible,
.quick-target-btn:focus-visible { outline: 2px solid rgba(59, 130, 246, 0.6); outline-offset: 1px; }

/* ===== 排好的新会话（第一行，28px：整行可点 + 右边 ✕ 取消） ===== */
.quick-pending-row {
  flex: 0 0 28px;
  height: 28px;
  min-width: 0;
  display: flex;
  align-items: stretch;
  gap: 2px;
}

.quick-session-pending {
  flex: 1 1 auto;
  min-width: 0;
}
.quick-session-pending .quick-session-name { color: rgba(59, 130, 246, 0.95); }

.quick-pending-cancel {
  flex: 0 0 20px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
}
.quick-pending-cancel:hover { background: rgba(127, 127, 127, 0.18); color: var(--text); }

/* ===== 新建会话的两个开关（权限模式 / 思考强度，各 34px：标签一行 + 按钮一行） ===== */
.quick-setting-row {
  flex: 0 0 34px;
  height: 34px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  padding: 0 8px;
}

.quick-setting-label {
  flex: 0 0 auto;
  font-size: 10px;
  line-height: 1;
  color: var(--text-muted);
}

/* 按钮最多 6 个（默认 + 五档），占满整行宽度；真放不下时宁可裁掉尾巴，
   也不让整行换行——卡片高度是写死的一组数字。 */
.quick-setting-chips {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow: hidden;
}

.quick-chip {
  flex: 0 0 auto;
  height: 18px;
  padding: 0 7px;
  border: 0;
  border-radius: 5px;
  background: rgba(127, 127, 127, 0.14);
  color: var(--text);
  font: inherit;
  font-size: 10px;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
}
.quick-chip:hover { background: rgba(127, 127, 127, 0.24); }
.quick-chip.is-selected {
  background: rgba(59, 130, 246, 0.85);
  color: #fff;
}

/* ===== 附件小标签行（24px，只在挂了文件时占位） =====
   路径不往输入框里塞：这里每个标签显示文件名 + ✕（单删），发送时路径跟着消息走。 */
.quick-attach-row {
  height: 24px;
  flex: 0 0 24px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow: hidden;
}
.quick-attach-row.is-empty { display: none; }

.quick-attach-chip {
  flex: 1 1 0;
  min-width: 0;
  height: 20px;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 0 2px 0 6px;
  border-radius: 5px;
  background: rgba(127, 127, 127, 0.14);
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1;
}

.quick-attach-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.quick-attach-remove {
  flex: 0 0 14px;
  height: 14px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
}
.quick-attach-remove:hover { background: rgba(127, 127, 127, 0.24); color: var(--text); }
.quick-attach-remove:focus-visible { outline: 2px solid rgba(59, 130, 246, 0.6); outline-offset: 1px; }

/* ===== 输入行（第 2 行，32px：输入框） ===== */
.quick-input-row {
  height: 32px;
  flex: 0 0 32px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.quick-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 28px;
  border: 1px solid var(--hud-border);
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  padding: 0 8px;
  outline: none;
  user-select: text;
}

.quick-input::placeholder {
  color: var(--text-muted);
  opacity: 0.85;
}

.quick-input:focus {
  border-color: rgba(59, 130, 246, 0.55);
  background: rgba(59, 130, 246, 0.08);
}

/* 「📎 添加文件…」：把文件路径填进输入框（面板只往终端里送文字） */
.quick-attach-btn {
  flex: 0 0 26px;
  height: 26px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.quick-attach-btn:hover { background: rgba(127, 127, 127, 0.18); }
.quick-attach-btn:focus-visible { outline: 2px solid rgba(59, 130, 246, 0.6); outline-offset: 1px; }

/* 键盘 Tab 导航时的焦点圈由各控件自己的 :focus-visible 提供，
   鼠标点击不显示系统默认的焦点环（macOS 上那圈黄边）。 */
</style>
</head>
<body>
  <div id="hud"></div>
  <script src="./session-hud-renderer.js"></script>
</body>
</html>
