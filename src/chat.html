<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:; media-src 'self' file:">
<title>Clawd Chat</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<!--
  挂载点：chat-renderer.js 在这里动态构建整个界面（工具栏 / 状态栏 / 消息区 / 输入区），
  所以本文件只保留空容器与脚本引用，不写静态界面，避免出现两套重复 UI。
  页面只通过 preload-chat.js 暴露的 window.chatAPI 与主进程通信。
  文案、语言由 chat-i18n.js + 渲染端负责；CSP 与 settings.html 保持一致。
-->
<div id="chatApp"></div>
<script src="chat-i18n.js"></script>
<script src="chat-renderer.js"></script>
</body>
</html>
